<svg
  viewBox="0 0 200 200"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="Payoff matrix: Claude plays the rows, OpenAI plays the columns"
>
  <defs>
    <linearGradient id="pm-paper" x1="12%" y1="6%" x2="92%" y2="98%">
      <stop offset="0%" stop-color="#f4e7cf" />
      <stop offset="45%" stop-color="#e8d5b4" />
      <stop offset="100%" stop-color="#c5d2c4" />
    </linearGradient>
    <radialGradient id="pm-glow" cx="30%" cy="24%" r="62%">
      <stop offset="0%" stop-color="#fffcf2" stop-opacity="1" />
      <stop offset="55%" stop-color="#e8dcc4" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#c5d2c4" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="pm-sheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fffdf6" stop-opacity="0" />
      <stop offset="50%" stop-color="#fffdf6" stop-opacity="0.42" />
      <stop offset="100%" stop-color="#fffdf6" stop-opacity="0" />
    </linearGradient>
    <!-- Sightlines fade toward the player they leave, so each reads as a gaze
         arriving at the matrix rather than a ruled line. -->
    <linearGradient id="pm-sight-v" gradientUnits="userSpaceOnUse" x1="0" y1="34" x2="0" y2="170">
      <stop offset="0%" stop-color="#2a3a36" stop-opacity="0" />
      <stop offset="50%" stop-color="#2a3a36" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#2a3a36" stop-opacity="0.32" />
    </linearGradient>
    <linearGradient id="pm-sight-h" gradientUnits="userSpaceOnUse" x1="34" y1="0" x2="172" y2="0">
      <stop offset="0%" stop-color="#2a3a36" stop-opacity="0" />
      <stop offset="50%" stop-color="#2a3a36" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#2a3a36" stop-opacity="0.32" />
    </linearGradient>
    <filter id="pm-lift" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.6" stdDeviation="2.2" flood-color="#1c2824" flood-opacity="0.3" />
    </filter>
    <clipPath id="pm-card">
      <rect width="200" height="200" />
    </clipPath>
  </defs>

  <style>
    /* One 12s loop is four rounds of play. The crosshair walks the square
       CC -> CD -> DD -> DC, so every outcome is held once per loop.
       --phase and --play let a host page scrub or freeze the loop. */
    .a {
      animation-duration: var(--dur, 12s);
      animation-delay: calc(var(--phase, 0s) + var(--d, 0s));
      animation-iteration-count: infinite;
      animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1);
      animation-play-state: var(--play, running);
    }

    .slide-col { animation-name: slideCol; }
    .slide-row { animation-name: slideRow; }

    @keyframes slideCol {
      0%, 19% { transform: translateX(0); }
      25%, 69% { transform: translateX(56px); }
      75%, 100% { transform: translateX(0); }
    }

    @keyframes slideRow {
      0%, 44% { transform: translateY(0); }
      50%, 94% { transform: translateY(56px); }
      100% { transform: translateY(0); }
    }

    /* Payoffs sit up and darken while their cell holds the crosshair. */
    .cell { animation-name: cellOn; }

    @keyframes cellOn {
      0%, 19% { opacity: 1; transform: scale(1); }
      25%, 94% { opacity: 0.24; transform: scale(0.94); }
      100% { opacity: 1; transform: scale(1); }
    }

    .row-on { animation-name: rowOn; }
    .col-on { animation-name: colOn; }

    @keyframes rowOn {
      0%, 44% { opacity: 1; }
      50%, 94% { opacity: 0.28; }
      100% { opacity: 1; }
    }

    @keyframes colOn {
      0%, 19% { opacity: 1; }
      25%, 69% { opacity: 0.28; }
      75%, 100% { opacity: 1; }
    }

    /* Each mark swells on the beat its own axis is about to move, then leans
       toward the move it chose. */
    .mark { animation-name: pulse; }
    .drift-row { animation-name: driftRow; }
    .drift-col { animation-name: driftCol; }

    @keyframes pulse {
      0%, 36% { transform: scale(1); }
      44% { transform: scale(1.12); }
      54%, 86% { transform: scale(1); }
      94% { transform: scale(1.12); }
      100% { transform: scale(1); }
    }

    @keyframes driftRow {
      0%, 44% { transform: translateY(-5px); }
      50%, 94% { transform: translateY(5px); }
      100% { transform: translateY(-5px); }
    }

    @keyframes driftCol {
      0%, 19% { transform: translateX(-5px); }
      25%, 69% { transform: translateX(5px); }
      75%, 100% { transform: translateX(-5px); }
    }

    .sheen {
      animation-name: sheen;
      animation-timing-function: cubic-bezier(0.4, 0, 0.5, 1);
    }

    @keyframes sheen {
      0% { transform: translateX(-160px); opacity: 0; }
      3%, 11% { opacity: 1; }
      14%, 100% { transform: translateX(330px); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .a { animation: none; }
      .cell, .row-on, .col-on { opacity: 0.24; }
      .cell-cc, .row-c, .col-c { opacity: 1; }
      .sheen { opacity: 0; }
    }
  </style>

  <rect width="200" height="200" fill="url(#pm-paper)" />
  <rect width="200" height="200" fill="url(#pm-glow)" />

  <!-- arena rings, carried over from the sibling cover -->
  <g stroke="#2a3a36" fill="none" stroke-width="1">
    <circle cx="116" cy="114" r="86" stroke-opacity="0.05" />
    <circle cx="116" cy="114" r="102" stroke-opacity="0.04" />
  </g>

  <!-- the matrix -->
  <rect x="60" y="58" width="112" height="112" fill="#2a3a36" fill-opacity="0.05" />
  <g stroke="#2a3a36" stroke-opacity="0.85" fill="none">
    <rect x="60" y="58" width="112" height="112" stroke-width="1.8" />
    <line x1="116" y1="58" x2="116" y2="170" stroke-width="1.2" />
    <line x1="60" y1="114" x2="172" y2="114" stroke-width="1.2" />
  </g>

  <!-- sightlines: each player's slides to the move it just chose -->
  <g fill="none" stroke-width="1">
    <g class="a slide-col"><line x1="88" y1="34" x2="88" y2="170" stroke="url(#pm-sight-v)" /></g>
    <g class="a slide-row"><line x1="34" y1="86" x2="172" y2="86" stroke="url(#pm-sight-h)" /></g>
  </g>

  <!-- the outcome currently in play -->
  <g class="a slide-col">
    <g class="a slide-row">
      <rect
        x="62"
        y="60"
        width="52"
        height="52"
        fill="#fffaf0"
        fill-opacity="0.97"
        stroke="#2a3a36"
        stroke-width="1.8"
        filter="url(#pm-lift)"
      />
    </g>
  </g>

  <!-- payoffs, Claude's first -->
  <g
    font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace"
    font-size="21"
    font-weight="500"
    text-anchor="middle"
    letter-spacing="-0.5"
  >
    <g transform="translate(88 86)">
      <g class="a cell cell-cc">
        <text dominant-baseline="central"><tspan fill="#c15f3c">3</tspan><tspan fill="#2a3a36" fill-opacity="0.4">,</tspan><tspan fill="#1e2f2b">3</tspan></text>
      </g>
    </g>
    <g transform="translate(144 86)">
      <g class="a cell" style="--d: -9s">
        <text dominant-baseline="central"><tspan fill="#c15f3c">0</tspan><tspan fill="#2a3a36" fill-opacity="0.4">,</tspan><tspan fill="#1e2f2b">5</tspan></text>
      </g>
    </g>
    <g transform="translate(88 142)">
      <g class="a cell" style="--d: -3s">
        <text dominant-baseline="central"><tspan fill="#c15f3c">5</tspan><tspan fill="#2a3a36" fill-opacity="0.4">,</tspan><tspan fill="#1e2f2b">0</tspan></text>
      </g>
    </g>
    <g transform="translate(144 142)">
      <g class="a cell" style="--d: -6s">
        <text dominant-baseline="central"><tspan fill="#c15f3c">1</tspan><tspan fill="#2a3a36" fill-opacity="0.4">,</tspan><tspan fill="#1e2f2b">1</tspan></text>
      </g>
    </g>
  </g>

  <!-- move labels -->
  <g
    font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace"
    font-size="11"
    letter-spacing="1"
    fill="#2a3a36"
  >
    <text class="a row-on row-c" x="52" y="86" text-anchor="end" dominant-baseline="central">C</text>
    <text class="a row-on" style="--d: -6s" x="52" y="142" text-anchor="end" dominant-baseline="central">D</text>
    <text class="a col-on col-c" x="88" y="46" text-anchor="middle" dominant-baseline="central">C</text>
    <text class="a col-on" style="--d: -6s" x="144" y="46" text-anchor="middle" dominant-baseline="central">D</text>
  </g>

  <!-- Claude plays the rows -->
  <g transform="translate(28 114)">
    <g class="a drift-row"><g class="a mark">
      <g transform="translate(-16 -16) scale(1.3333)">
        <path
          fill="#c15f3c"
          d="m4.7144 15.9555 4.7174-2.6471.079-.2307-.079-.1275h-.2307l-.7893-.0486-2.6956-.0729-2.3375-.0971-2.2646-.1214-.5707-.1215-.5343-.7042.0546-.3522.4797-.3218.686.0608 1.5179.1032 2.2767.1578 1.6514.0972 2.4468.255h.3886l.0546-.1579-.1336-.0971-.1032-.0972L6.973 9.8356l-2.55-1.6879-1.3356-.9714-.7225-.4918-.3643-.4614-.1578-1.0078.6557-.7225.8803.0607.2246.0607.8925.686 1.9064 1.4754 2.4893 1.8336.3643.3035.1457-.1032.0182-.0728-.164-.2733-1.3539-2.4467-1.445-2.4893-.6435-1.032-.17-.6194c-.0607-.255-.1032-.4674-.1032-.7285L6.287.1335 6.6997 0l.9957.1336.419.3642.6192 1.4147 1.0018 2.2282 1.5543 3.0296.4553.8985.2429.8318.091.255h.1579v-.1457l.1275-1.706.2368-2.0947.2307-2.6957.0789-.7589.3764-.9107.7468-.4918.5828.2793.4797.686-.0668.4433-.2853 1.8517-.5586 2.9021-.3643 1.9429h.2125l.2429-.2429.9835-1.3053 1.6514-2.0643.7286-.8196.85-.9046.5464-.4311h1.0321l.759 1.1293-.34 1.1657-1.0625 1.3478-.8804 1.1414-1.2628 1.7-.7893 1.36.0729.1093.1882-.0183 2.8535-.607 1.5421-.2794 1.8396-.3157.8318.3886.091.3946-.3278.8075-1.967.4857-2.3072.4614-3.4364.8136-.0425.0304.0486.0607 1.5482.1457.6618.0364h1.621l3.0175.2247.7892.522.4736.6376-.079.4857-1.2142.6193-1.6393-.3886-3.825-.9107-1.3113-.3279h-.1822v.1093l1.0929 1.0686 2.0035 1.8092 2.5075 2.3314.1275.5768-.3218.4554-.34-.0486-2.2039-1.6575-.85-.7468-1.9246-1.621h-.1275v.17l.4432.6496 2.3436 3.5214.1214 1.0807-.17.3521-.6071.2125-.6679-.1214-1.3721-1.9246L14.38 17.959l-1.1414-1.9428-.1397.079-.674 7.2552-.3156.3703-.7286.2793-.6071-.4614-.3218-.7468.3218-1.4753.3886-1.9246.3157-1.53.2853-1.9004.17-.6314-.0121-.0425-.1397.0182-1.4328 1.9672-2.1796 2.9446-1.7243 1.8456-.4128.164-.7164-.3704.0667-.6618.4008-.5889 2.386-3.0357 1.4389-1.882.929-1.0868-.0062-.1579h-.0546l-6.3385 4.1164-1.1293.1457-.4857-.4554.0608-.7467.2307-.2429 1.9064-1.3114Z"
        />
      </g>
    </g></g>
  </g>

  <!-- OpenAI plays the columns -->
  <g transform="translate(116 24)">
    <g class="a drift-col"><g class="a mark" style="--d: -3s">
      <g transform="translate(-14 -14) scale(1.1667)">
        <path
          fill="#1e2f2b"
          d="M22.2819 9.8211a5.9847 5.9847 0 0 0-.5157-4.9108 6.0462 6.0462 0 0 0-6.5098-2.9A6.0651 6.0651 0 0 0 4.9807 4.1818a5.9847 5.9847 0 0 0-3.9977 2.9 6.0462 6.0462 0 0 0 .7427 7.0966 5.98 5.98 0 0 0 .511 4.9107 6.051 6.051 0 0 0 6.5146 2.9001A5.9847 5.9847 0 0 0 13.2599 24a6.0557 6.0557 0 0 0 5.7718-4.2058 5.9894 5.9894 0 0 0 3.9977-2.9001 6.0557 6.0557 0 0 0-.7475-7.0729zm-9.022 12.6081a4.4755 4.4755 0 0 1-2.8764-1.0408l.1419-.0804 4.7783-2.7582a.7948.7948 0 0 0 .3927-.6813v-6.7369l2.02 1.1686a.071.071 0 0 1 .038.052v5.5826a4.504 4.504 0 0 1-4.4945 4.4944zm-9.6607-4.1254a4.4708 4.4708 0 0 1-.5346-3.0137l.142.0852 4.783 2.7582a.7712.7712 0 0 0 .7806 0l5.8428-3.3685v2.3324a.0804.0804 0 0 1-.0332.0615L9.74 19.9502a4.4992 4.4992 0 0 1-6.1408-1.6464zM2.3408 7.8956a4.485 4.485 0 0 1 2.3655-1.9728V11.6a.7664.7664 0 0 0 .3879.6765l5.8144 3.3543-2.0201 1.1685a.0757.0757 0 0 1-.071 0l-4.8303-2.7865A4.504 4.504 0 0 1 2.3408 7.872zm16.5963 3.8558L13.1038 8.364 15.1192 7.2a.0757.0757 0 0 1 .071 0l4.8303 2.7913a4.4944 4.4944 0 0 1-.6765 8.1042v-5.6772a.79.79 0 0 0-.407-.667zm2.0107-3.0231l-.142-.0852-4.7735-2.7818a.7759.7759 0 0 0-.7854 0L9.409 9.2297V6.8974a.0662.0662 0 0 1 .0284-.0615l4.8303-2.7866a4.4992 4.4992 0 0 1 6.6802 4.66zM8.3065 12.863l-2.02-1.1638a.0804.0804 0 0 1-.038-.0567V6.0742a4.4992 4.4992 0 0 1 7.3757-3.4537l-.142.0805L8.704 5.459a.7948.7948 0 0 0-.3927.6813zm1.0976-2.3654l2.602-1.4998 2.6069 1.4998v2.9994l-2.5974 1.4997-2.6067-1.4997Z"
        />
      </g>
    </g></g>
  </g>

  <!-- light crossing the paper -->
  <g clip-path="url(#pm-card)">
    <g transform="skewX(-18)">
      <rect class="a sheen" style="--dur: 24s" x="-40" y="-40" width="34" height="300" fill="url(#pm-sheen)" />
    </g>
  </g>
</svg>
